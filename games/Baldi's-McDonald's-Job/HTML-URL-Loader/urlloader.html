<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Loader & Viewer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the editor */
        textarea::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #1e1e24; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        /* Modal transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.2s ease-out; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: all 0.15s ease-in; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-gray-900 text-white shadow-md z-10 flex-shrink-0">
        <div class="max-w-screen-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                <h1 class="text-xl font-bold tracking-wide">HTML Viewer UI</h1>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button id="btn-import" class="flex items-center px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-md text-sm font-medium transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Import HTML
                </button>
                <button id="btn-export" class="flex items-center px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-md text-sm font-medium transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export HTML
                </button>
                <button id="btn-load-modal" class="flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-md text-sm font-bold shadow-lg shadow-blue-500/30 transition-all">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    Load URL
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row w-full h-full overflow-hidden">
        
        <!-- Code Editor Pane -->
        <div id="editor-pane" class="flex flex-col bg-[#1e1e24] shadow-inner relative group" style="flex-basis: 50%; min-width: 10%; min-height: 10%;">
            <div class="bg-gray-800 text-gray-300 text-xs px-4 py-2 uppercase tracking-wider font-semibold flex justify-between items-center">
                <span>Source Code</span>
                <span id="char-count" class="text-gray-500 font-mono">0 chars</span>
            </div>
            <textarea id="code-editor" class="flex-1 w-full p-4 bg-[#1e1e24] text-green-400 font-mono text-sm resize-none focus:outline-none focus:ring-1 focus:ring-blue-500/50" spellcheck="false" placeholder="Paste your HTML code here, or click 'Load URL' to fetch a webpage..."></textarea>
        </div>

        <!-- Resizer Handle -->
        <div id="resizer" class="flex-shrink-0 h-3 lg:h-full w-full lg:w-3 bg-gray-300 hover:bg-blue-400 cursor-row-resize lg:cursor-col-resize flex items-center justify-center transition-colors z-20">
            <div class="w-8 h-1 lg:w-1 lg:h-8 bg-gray-500 rounded-full pointer-events-none"></div>
        </div>

        <!-- Preview Pane -->
        <div id="preview-pane" class="flex-1 flex flex-col bg-white relative min-w-0 min-h-0">
            <div class="bg-gray-100 border-b border-gray-200 text-gray-600 text-xs px-4 py-2 uppercase tracking-wider font-semibold flex items-center justify-between shadow-sm">
                <span>Live Preview</span>
                <div class="flex items-center space-x-2">
                    <button id="btn-fullscreen" class="p-1 hover:text-blue-600 hover:bg-gray-300 rounded transition-colors" title="Full Screen">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                    <button id="btn-newtab" class="p-1 hover:text-blue-600 hover:bg-gray-300 rounded transition-colors" title="Open in New Tab">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </button>
                </div>
            </div>
            <!-- Using srcdoc directly parses the raw HTML text we feed it -->
            <iframe id="preview-frame" class="w-full flex-1 border-none bg-white" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
            
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
                <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-3"></div>
                <p class="text-blue-800 font-medium">Fetching Page Data...</p>
            </div>
        </div>

    </main>

    <!-- Hidden File Input for Importing -->
    <input type="file" id="file-input" class="hidden" accept=".html,.htm,.txt" />

    <!-- URL Loader Modal -->
    <div id="url-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">Load HTML from URL</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-500 mb-4">Enter a website URL to extract and load its raw HTML content into the editor.</p>
                <div class="mb-4">
                    <label for="url-input" class="block text-sm font-medium text-gray-700 mb-1">Target URL</label>
                    <input type="url" id="url-input" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none" placeholder="https://example.com" value="https://example.com">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button id="btn-cancel-modal" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Cancel</button>
                    <button id="btn-fetch-url" class="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium shadow-md transition-colors">Fetch HTML</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toast-msg">Error occurred.</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const editor = document.getElementById('code-editor');
            const previewFrame = document.getElementById('preview-frame');
            const charCount = document.getElementById('char-count');
            const loadingOverlay = document.getElementById('loading-overlay');
            
            // Layout Elements
            const editorPane = document.getElementById('editor-pane');
            const previewPane = document.getElementById('preview-pane');
            const resizer = document.getElementById('resizer');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const btnNewTab = document.getElementById('btn-newtab');

            // Modal Elements
            const modal = document.getElementById('url-modal');
            const btnLoadModal = document.getElementById('btn-load-modal');
            const btnCloseModal = document.getElementById('btn-close-modal');
            const btnCancelModal = document.getElementById('btn-cancel-modal');
            const btnFetchUrl = document.getElementById('btn-fetch-url');
            const urlInput = document.getElementById('url-input');

            // Top bar tools
            const btnImport = document.getElementById('btn-import');
            const btnExport = document.getElementById('btn-export');
            const fileInput = document.getElementById('file-input');

            // --- Core Functionality: Live Preview Rendering ---
            
            // Updates the iframe with the current content of the editor
            function updatePreview() {
                const code = editor.value;
                previewFrame.srcdoc = code;
                charCount.textContent = `${code.length.toLocaleString()} chars`;
            }

            // Listen for changes in the text area
            editor.addEventListener('input', updatePreview);

            // Set initial state
            editor.value = "<h1>Welcome to the HTML Viewer</h1>\n<p>Paste your HTML here, or click <strong>Load URL</strong> to fetch code from the web.</p>\n<style>\n  body { font-family: system-ui, sans-serif; padding: 2rem; color: #333; }\n  h1 { color: #2563eb; }\n</style>";
            updatePreview();


            // --- Feature: Load URL via Proxy ---

            function showModal() {
                modal.classList.remove('hidden');
                setTimeout(() => urlInput.focus(), 100);
            }

            function hideModal() {
                modal.classList.add('hidden');
            }

            function showToast(message, isError = true) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-msg').textContent = message;
                toast.classList.remove('bg-red-600', 'bg-green-600');
                toast.classList.add(isError ? 'bg-red-600' : 'bg-green-600');
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.transform = 'translateY(5rem)';
                    toast.style.opacity = '0';
                }, 4000);
            }

            btnLoadModal.addEventListener('click', showModal);
            btnCloseModal.addEventListener('click', hideModal);
            btnCancelModal.addEventListener('click', hideModal);

            btnFetchUrl.addEventListener('click', async () => {
                let targetUrl = urlInput.value.trim();
                
                if (!targetUrl) {
                    showToast("Please enter a valid URL.");
                    return;
                }
                
                // Prepend https if missing
                if (!/^https?:\/\//i.test(targetUrl)) {
                    targetUrl = 'https://' + targetUrl;
                }

                hideModal();
                loadingOverlay.classList.remove('hidden');

                try {
                    // Array of public CORS proxies to ensure maximum reliability
                    const proxies = [
                        'https://api.codetabs.com/v1/proxy/?quest=',
                        'https://corsproxy.io/?',
                        'https://api.allorigins.win/raw?url='
                    ];

                    let htmlContent = null;
                    
                    for (const proxy of proxies) {
                        try {
                            const response = await fetch(proxy + encodeURIComponent(targetUrl));
                            if (response.ok) {
                                htmlContent = await response.text();
                                break; // Successfully fetched, break the loop
                            }
                        } catch (err) {
                            console.warn(`Proxy failed: ${proxy}`, err);
                            // Continue to the next proxy
                        }
                    }
                    
                    if (htmlContent) {
                        // Smart Fix: Inject a <base> tag to help relative links (images, css) resolve
                        try {
                            const parsedUrl = new URL(targetUrl);
                            const baseTag = `\n    <!-- Injected to fix relative paths -->\n    <base href="${parsedUrl.origin}/">\n`;
                            
                            if (htmlContent.includes('<head>')) {
                                htmlContent = htmlContent.replace('<head>', `<head>${baseTag}`);
                            } else {
                                htmlContent = baseTag + htmlContent;
                            }
                        } catch(err) {
                            console.warn("Could not inject base URL tag.", err);
                        }

                        editor.value = htmlContent;
                        updatePreview();
                        showToast("URL loaded successfully!", false);
                    } else {
                        throw new Error("Failed to fetch. The website might be blocking access or is currently unreachable.");
                    }
                } catch (error) {
                    console.error("Fetch Error:", error);
                    showToast(error.message);
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            });

            // Trigger fetch on Enter key inside the modal
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnFetchUrl.click();
                }
            });


            // --- Feature: Import HTML ---

            btnImport.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    editor.value = e.target.result;
                    updatePreview();
                    showToast("File imported successfully!", false);
                };
                reader.onerror = () => {
                    showToast("Error reading file.");
                };
                reader.readAsText(file);
                
                // Reset input so the same file can be selected again if needed
                fileInput.value = '';
            });


            // --- Feature: Export HTML ---

            btnExport.addEventListener('click', () => {
                const htmlContent = editor.value;
                if (!htmlContent.trim()) {
                    showToast("Nothing to export!");
                    return;
                }

                // Create a blob from the editor content
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                // Create a temporary anchor to trigger the download
                const a = document.createElement('a');
                a.href = url;
                a.download = 'exported_page.html';
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // --- Feature: Resize Panes ---
            let isResizing = false;

            function startResize(e) {
                isResizing = true;
                const isDesktop = window.innerWidth >= 1024;
                document.body.style.cursor = isDesktop ? 'col-resize' : 'row-resize';
                previewFrame.style.pointerEvents = 'none'; // Prevent iframe capturing mouse
                if (e.type === 'mousedown') e.preventDefault(); // Prevent text selection
            }

            function doResize(clientX, clientY) {
                if (!isResizing) return;
                const main = document.querySelector('main');
                const isDesktop = window.innerWidth >= 1024;
                
                if (isDesktop) {
                    const containerWidth = main.clientWidth;
                    let newWidth = (clientX / containerWidth) * 100;
                    newWidth = Math.max(10, Math.min(newWidth, 90));
                    editorPane.style.flexBasis = `${newWidth}%`;
                } else {
                    const containerHeight = main.clientHeight;
                    const rect = main.getBoundingClientRect();
                    let newHeight = ((clientY - rect.top) / containerHeight) * 100;
                    newHeight = Math.max(10, Math.min(newHeight, 90));
                    editorPane.style.flexBasis = `${newHeight}%`;
                }
            }

            function stopResize() {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    previewFrame.style.pointerEvents = 'auto'; // Re-enable iframe clicks
                }
            }

            // Mouse Events
            resizer.addEventListener('mousedown', startResize);
            document.addEventListener('mousemove', (e) => doResize(e.clientX, e.clientY));
            document.addEventListener('mouseup', stopResize);

            // Touch Events for Mobile
            resizer.addEventListener('touchstart', startResize, { passive: true });
            document.addEventListener('touchmove', (e) => {
                if (isResizing) doResize(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            document.addEventListener('touchend', stopResize);

            // --- Feature: Full Screen Preview ---
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    previewPane.requestFullscreen().catch(err => {
                        showToast("Error attempting to enable full-screen mode.");
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                // Ensure layout matches fullscreen styling
                if (document.fullscreenElement) {
                    previewPane.classList.add('h-screen', 'w-screen');
                } else {
                    previewPane.classList.remove('h-screen', 'w-screen');
                }
            });

            // --- Feature: Open in New Tab ---
            btnNewTab.addEventListener('click', () => {
                const newWin = window.open('', '_blank');
                if (newWin) {
                    newWin.document.open();
                    newWin.document.write(editor.value);
                    newWin.document.close();
                } else {
                    showToast("Popup blocked! Please allow popups for this site.");
                }
            });
        });
    </script>
</body>
</html>
